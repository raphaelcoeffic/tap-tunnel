[package]
name = "tap-tunnel"
version = "0.1.0"
edition = "2024"

[dependencies]
nix = { version = "0.29", features = ["sched", "poll", "ioctl", "net"] }
libc = "0.2"
log = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros"] }

[dev-dependencies]
env_logger = "0.11"
