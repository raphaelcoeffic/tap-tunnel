[workspace]
members = [".", "proxy"]

[workspace.dependencies]
env_logger = "0.11"
libc = "0.2"
log = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros"] }

[package]
name = "tap-tunnel"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["io-std", "time", "sync"] }
smoltcp = { version = "0.12", default-features = false, features = ["medium-ethernet", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "alloc", "log"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
env_logger = { workspace = true }
