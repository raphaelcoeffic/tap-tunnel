[package]
name = "tap-tunnel-proxy"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tap-tunnel-proxy"
path = "src/main.rs"

[dependencies]
tap-tunnel = { path = ".." }
clap = { version = "4", features = ["derive"] }
env_logger = { workspace = true }
nix = { version = "0.29", features = ["sched"] }
libc = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
netconfig-rs = "0.1"
ipnet = "2"
