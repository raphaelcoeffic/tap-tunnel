[package]
name = "tap-tunnel"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tap-tunnel-proxy"
path = "src/bin/proxy.rs"

[dependencies]
nix = { version = "0.29", features = ["sched", "poll", "ioctl", "net"] }
libc = "0.2"
log = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "io-std", "macros", "time", "sync"] }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
smoltcp = { version = "0.12", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp", "alloc", "log"] }
crossbeam-channel = "0.5"
